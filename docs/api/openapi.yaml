openapi: 3.1.0

info:
  title: Entreck API
  version: "1.0"
  description: |-
    Contract-first specification for the Entreck REST API, a mobile-first
    directory of physical points of sale (POS) for event tickets.

    v1 scope:
    - Publish events and associate one or more points of sale.
    - Search events by name/category, list POS by event, show POS details.
    - The API does **not** sell, pay for, or issue tickets in v1.

    All endpoints are public in v1. JWT authentication is deferred to v1.1;
    deploy behind a private network or an auth proxy. Endpoints are versioned
    under `/api/v1`.

    Use case IDs (UC-Bxx, UC-Oxx, UC-Sxx) reference `docs/use-cases.md`.
    Domain terminology (Event, PointOfSale, availability signal, nearby search)
    follows the glossary in `AGENTS.md` section 6.

servers:
  - url: http://localhost:8080
    description: Local development server

security: []

tags:
  - name: Events
    description: Search, publish, and update events; manage event-POS links
  - name: Points of Sale
    description: Register and update points of sale; manage availability

paths:
  /api/v1/events:
    get:
      tags: [Events]
      summary: Search events (B01, B02)
      description: |-
        Searches events with optional name and category filters and pagination.

        Requested page sizes larger than 100 are silently reduced to 100.
        Responses are wrapped in the pagination envelope (content, meta,
        first, last).
      operationId: searchEvents
      parameters:
        - name: name
          in: query
          required: false
          description: Case-insensitive event name filter
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: Event category filter
          schema:
            $ref: "#/components/schemas/EventCategory"
        - name: page
          in: query
          required: false
          description: Zero-based page number
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Page size, capped at 100
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated list of event summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSummaryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Events]
      summary: Publish a new event (O01)
      description: |-
        Creates and publishes an event. The organizer ID is supplied as a
        query parameter because authentication is deferred in v1. The event ID
        is generated by the database and returned in the response.
      operationId: publishEvent
      parameters:
        - name: organizerId
          in: query
          required: true
          description: Organizer creating the event (v1 auth placeholder)
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event created and published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Event identifier
        schema:
          type: integer
          format: int64
    get:
      tags: [Events]
      summary: Get event detail (B03)
      description: Returns the full event detail, including the description.
      operationId: getEventDetail
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Events]
      summary: Update an event (O02)
      description: |-
        Partially updates an event (PATCH semantics). Only the fields present
        in the request body are changed; absent fields are left untouched.
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/events/{eventId}/points-of-sale:
    parameters:
      - name: eventId
        in: path
        required: true
        description: Event identifier
        schema:
          type: integer
          format: int64
    get:
      tags: [Events]
      summary: List event points of sale (B04)
      description: Returns all POS records linked to an event, with availability.
      operationId: listEventPointsOfSale
      responses:
        "200":
          description: Linked points of sale with availability status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkedPos"
        "404":
          $ref: "#/components/responses/EventNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Events]
      summary: Associate a point of sale with an event (O03)
      description: |-
        Creates a link between an existing event and an existing point of sale.
        The link is created with availability status UNKNOWN until it is
        explicitly updated.
      operationId: associatePointOfSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociateRequest"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedPos"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/events/{eventId}/points-of-sale/{posId}:
    parameters:
      - name: eventId
        in: path
        required: true
        description: Event identifier
        schema:
          type: integer
          format: int64
      - name: posId
        in: path
        required: true
        description: Point of sale identifier
        schema:
          type: integer
          format: int64
    delete:
      tags: [Events]
      summary: Dissociate a point of sale from an event (O04)
      description: Removes the link between an event and a point of sale.
      operationId: dissociatePointOfSale
      responses:
        "204":
          description: Link removed
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/points-of-sale:
    post:
      tags: [Points of Sale]
      summary: Register a point of sale (S01)
      description: |-
        Registers a new point of sale. The shop ID is supplied in the request
        body because authentication is deferred in v1. The POS ID is generated
        by the database and returned in the response.
      operationId: registerPointOfSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePointOfSaleRequest"
      responses:
        "201":
          description: Point of sale registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointOfSale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/points-of-sale/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Point of sale identifier
        schema:
          type: integer
          format: int64
    get:
      tags: [Points of Sale]
      summary: Get point of sale detail (B06)
      description: |-
        Returns the full point of sale detail: address, geographic location,
        contact, opening hours, and operational status.
      operationId: getPointOfSaleDetail
      responses:
        "200":
          description: Point of sale detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointOfSaleDetail"
        "404":
          $ref: "#/components/responses/PointOfSaleNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Points of Sale]
      summary: Update a point of sale (S02)
      description: |-
        Partially updates a point of sale (PATCH semantics). Only the fields
        present in the request body are changed; absent fields are left
        untouched.
      operationId: updatePointOfSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePointOfSaleRequest"
      responses:
        "200":
          description: Updated point of sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointOfSale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PointOfSaleNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/points-of-sale/{posId}/events/{eventId}/availability:
    parameters:
      - name: posId
        in: path
        required: true
        description: Point of sale identifier
        schema:
          type: integer
          format: int64
      - name: eventId
        in: path
        required: true
        description: Event identifier
        schema:
          type: integer
          format: int64
    put:
      tags: [Points of Sale]
      summary: Update availability (S03)
      description: |-
        Updates the ticket availability signal for an event-POS link (PUT
        semantics). Availability is a directory signal, not a real inventory
        count.
      operationId: updateAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
      responses:
        "200":
          description: Updated availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/LinkNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  responses:
    BadRequest:
      description: Request validation failed (error code VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION_ERROR
            message: Request validation failed
            fieldErrors:
              - field: name
                message: Event name is required
    EventNotFound:
      description: Event not found (error code EVENT_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: EVENT_NOT_FOUND
            message: Event with id 1 not found
            fieldErrors: []
    PointOfSaleNotFound:
      description: Point of sale not found (error code POS_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: POS_NOT_FOUND
            message: Point of sale with id 1 not found
            fieldErrors: []
    LinkNotFound:
      description: Event-POS link not found (error code LINK_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: LINK_NOT_FOUND
            message: No link between event 1 and point of sale 2
            fieldErrors: []
    Unprocessable:
      description: |-
        Business rule violation (error code DUPLICATE_EVENT_NAME or
        LINK_ALREADY_EXISTS)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: DUPLICATE_EVENT_NAME
            message: An event with this name already exists
            fieldErrors: []
    InternalError:
      description: Unexpected error (error code INTERNAL_ERROR)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred
            correlationId: 6e2f9b8c-9a41-4f3c-b1d0-2e0a0c3f7d9e
            fieldErrors: []

  schemas:
    EventCategory:
      type: string
      description: Category of a ticketed event
      enum:
        - CONCERT
        - SPORTS
        - THEATER
        - FESTIVAL
        - CONFERENCE
        - OTHER
    EventStatus:
      type: string
      description: |-
        Lifecycle status of an event. State transitions follow
        DRAFT -> PUBLISHED -> CANCELLED; a cancelled event cannot change status.
      enum:
        - DRAFT
        - PUBLISHED
        - CANCELLED
    AvailabilityStatus:
      type: string
      description: Ticket availability signal for an event at a point of sale
      enum:
        - AVAILABLE
        - LIMITED
        - SOLD_OUT
        - UNKNOWN
    POSStatus:
      type: string
      description: Operational status of a point of sale
      enum:
        - ACTIVE
        - INACTIVE

    CreateEventRequest:
      type: object
      description: Request body for publishing a new event (O01)
      required: [name, category, eventDate]
      properties:
        name:
          type: string
          maxLength: 200
          description: Event name
        category:
          $ref: "#/components/schemas/EventCategory"
        eventDate:
          type: string
          format: date-time
          description: Date and time of the event (ISO-8601, UTC)
        description:
          type: string
          maxLength: 2000
          description: Event description
    UpdateEventRequest:
      type: object
      description: Request body for partially updating an event (O02, PATCH)
      properties:
        name:
          type: string
          maxLength: 200
          description: New event name
        category:
          $ref: "#/components/schemas/EventCategory"
        eventDate:
          type: string
          format: date-time
          description: New event date (ISO-8601, UTC)
        description:
          type: string
          maxLength: 2000
          description: New event description
    AssociateRequest:
      type: object
      description: Request body for associating a POS with an event (O03)
      required: [posId]
      properties:
        posId:
          type: integer
          format: int64
          description: Point of sale identifier to associate
        note:
          type: string
          maxLength: 140
          description: Optional note about the association
    AvailabilityRequest:
      type: object
      description: Request body for updating an event-POS availability (S03)
      required: [availabilityStatus]
      properties:
        availabilityStatus:
          $ref: "#/components/schemas/AvailabilityStatus"
        note:
          type: string
          maxLength: 140
          description: Optional note describing the availability change

    Event:
      type: object
      description: Complete view of an event
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: "#/components/schemas/EventCategory"
        eventDate:
          type: string
          format: date-time
        description:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        organizerId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventSummary:
      type: object
      description: Lightweight event representation for list/search results
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: "#/components/schemas/EventCategory"
        eventDate:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/EventStatus"
        organizerId:
          type: integer
          format: int64
    EventDetail:
      type: object
      description: Full event representation for detail views
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: "#/components/schemas/EventCategory"
        eventDate:
          type: string
          format: date-time
        description:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        organizerId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LinkedPos:
      type: object
      description: A point of sale linked to an event, with availability (B04)
      properties:
        linkId:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        posId:
          type: integer
          format: int64
        posName:
          type: string
        availabilityStatus:
          $ref: "#/components/schemas/AvailabilityStatus"
        note:
          type: string
        updatedAt:
          type: string
          format: date-time
    Availability:
      type: object
      description: Updated availability signal for an event-POS link (S03)
      properties:
        linkId:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        posId:
          type: integer
          format: int64
        availabilityStatus:
          $ref: "#/components/schemas/AvailabilityStatus"
        note:
          type: string
        updatedAt:
          type: string
          format: date-time

    CreatePointOfSaleRequest:
      type: object
      description: Request body for registering a point of sale (S01)
      required: [name, address, location, contact, openingHours, shopId]
      properties:
        name:
          type: string
          maxLength: 200
        address:
          $ref: "#/components/schemas/Address"
        location:
          $ref: "#/components/schemas/GeoLocation"
        contact:
          $ref: "#/components/schemas/Contact"
        openingHours:
          $ref: "#/components/schemas/OpeningHours"
        shopId:
          type: integer
          format: int64
          description: Shop identifier (v1 auth placeholder)
    UpdatePointOfSaleRequest:
      type: object
      description: Request body for partially updating a point of sale (S02, PATCH)
      properties:
        name:
          type: string
          maxLength: 200
        address:
          $ref: "#/components/schemas/Address"
        location:
          $ref: "#/components/schemas/GeoLocation"
        contact:
          $ref: "#/components/schemas/Contact"
        openingHours:
          $ref: "#/components/schemas/OpeningHours"

    PointOfSale:
      type: object
      description: Summary representation of a point of sale
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          $ref: "#/components/schemas/POSStatus"
        shopId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PointOfSaleDetail:
      type: object
      description: Full representation of a point of sale
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        location:
          $ref: "#/components/schemas/GeoLocation"
        contact:
          $ref: "#/components/schemas/Contact"
        openingHours:
          $ref: "#/components/schemas/OpeningHours"
        status:
          $ref: "#/components/schemas/POSStatus"
        shopId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        street:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        zipCode:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 2
          description: ISO-3166 alpha-2 country code
    Contact:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 50
    GeoLocation:
      type: object
      description: Geographic coordinates in decimal degrees
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    OpeningHours:
      type: object
      properties:
        windows:
          type: array
          description: Weekly time windows
          items:
            $ref: "#/components/schemas/WeeklyWindow"
        timezone:
          type: string
          maxLength: 50
          description: IANA timezone identifier, e.g. America/Argentina/Buenos_Aires
    WeeklyWindow:
      type: object
      properties:
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        open:
          type: string
          format: partial-time
          description: Opening time (HH:mm:ss)
        close:
          type: string
          format: partial-time
          description: Closing time (HH:mm:ss)

    PageMeta:
      type: object
      description: Pagination metadata
      properties:
        page:
          type: integer
          format: int32
          description: Current page number (0-based)
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    EventSummaryPage:
      type: object
      description: Pagination envelope for event search results
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"
        first:
          type: boolean
          description: Whether this is the first page
        last:
          type: boolean
          description: Whether this is the last page

    ErrorResponse:
      type: object
      description: |-
        Consistent error envelope returned by the global exception handler.
        correlationId is present only for unexpected 500 errors; fieldErrors is
        present only for 400 validation errors.
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        correlationId:
          type: string
          description: Tracing identifier for unexpected errors (500 only)
        fieldErrors:
          type: array
          description: Field-level validation errors (400 only)
          items:
            $ref: "#/components/schemas/FieldErrorItem"
    FieldErrorItem:
      type: object
      properties:
        field:
          type: string
          description: Field path
        message:
          type: string
          description: Validation message
